# Render Blueprint — https://render.com/docs/blueprint-spec
# After first deploy, set environment variables in the Render dashboard
# (OPENROUTER_API_KEY required; Google vars optional for Drive/Sheets).

services:
  - type: web
    name: bxo
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INITIAL_SETUP_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
